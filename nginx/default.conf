server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Потрібно для підтвердження домену через Let's Encrypt (HTTP-01 challenge)
    # перед випуском SSL-сертифіката. Нешкідливо зараз — не вимагає сертифіката,
    # просто віддає файли з тому, який certbot заповнить під час випуску.
    # Детальніше — docs/https-setup.md.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /media/ {
        alias /media/;
    }

    location / {
        proxy_pass http://frontend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
