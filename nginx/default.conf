server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    gzip on;
    gzip_types application/json text/css application/javascript text/plain image/svg+xml;
    gzip_min_length 1000;

    # Потрібно для підтвердження домену через Let's Encrypt (HTTP-01 challenge)
    # перед випуском SSL-сертифіката. Нешкідливо зараз — не вимагає сертифіката,
    # просто віддає файли з тому, який certbot заповнить під час випуску.
    # Детальніше — docs/https-setup.md.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /media/ {
        alias /media/;
        # Фото товарів — файли з унікальним іменем (uuid у назві), заміна
        # означає нове ім'я файлу, тому довге кешування безпечне.
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://frontend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Без цього Next.js у dev-режимі не може відкрити WebSocket для
        # Hot Module Reload через nginx (браузер отримує "Unexpected
        # response code: 404" на wss://.../_next/webpack-hmr) — і, як
        # з'ясувалось, доки цей WebSocket не підключиться, клієнтський
        # бандл узагалі не завершує гідратацію: сторінка виглядає
        # нормально, але жодна кнопка не працює. У проді (next start,
        # без HMR) це не потрібно, але нешкідливо лишити завжди.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
